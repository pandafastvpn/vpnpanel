# 宝塔面板 Nginx 伪静态规则
# 将以下内容粘贴到宝塔面板 > 网站 > 设置 > 伪静态 中
#
# location / {
#     if (!-f $request_filename) {
#         rewrite ^(.*)$ /index.php last;
#     }
# }
#
# 或者使用完整的配置:
#
# location / {
#     try_files $uri $uri/ /index.php?$query_string;
# }

# 网站根目录必须指向项目的 public/ 目录。
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 禁止访问敏感目录和文件（即使网站根目录配置错误，也尽量避免泄露源码）
location ~ ^/(app|config|storage|scripts|cron|vendor)(/|$) {
    deny all;
    return 404;
}

location ~ ^/(\.env|\.git|composer\.(json|lock)|.*\.(sql|md|log|bak|conf|yml|yaml))$ {
    deny all;
    return 404;
}

# 禁止访问隐藏文件，但保留 ACME/Let's Encrypt 验证目录
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}
