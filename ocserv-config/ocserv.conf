# ocserv / RemLink 配置文件
# /etc/ocserv/ocserv.conf
# 
# 此文件用于配置 ocserv VPN服务器（或 RemLink 管理的 ocserv），与 ToughRadius RADIUS 集成
# RemLink: https://github.com/wsczx/RemLink/

# 认证方式: RADIUS (通过PAP)
# RemLink 安装的 ocserv 同样使用此配置
auth = "radius[auth=true,acct=true]"

# RADIUS 服务器配置
# ToughRadius 默认监听 0.0.0.0:1812(认证) 和 0.0.0.0:1813(计费)
# 如果 ToughRadius 和 ocserv/RemLink 在同一台服务器, 使用 127.0.0.1
# 否则填写 ToughRadius 所在服务器的 IP
radius-server = "127.0.0.1:1812"
radius-secret = "your_radius_secret"
radius-acct-port = 1813

# 重要: radius-secret 必须与 ToughRadius 中添加的 NAS 设备共享密钥一致
# radius-server = "x.x.x.x:1812"

# 监听地址和端口
listen = "0.0.0.0:443"
tcp-listen = "0.0.0.0:443"
udp-listen = "0.0.0.0:443"

# TLS/SSL证书
# 使用自签名证书或Let's Encrypt证书
server-cert = /etc/ocserv/certs/server-cert.pem
server-key = /etc/ocserv/certs/server-key.pem

# 如果使用Let's Encrypt:
# server-cert = /etc/letsencrypt/live/your-domain.com/fullchain.pem
# server-key = /etc/letsencrypt/live/your-domain.com/privkey.pem

# 最大连接数
max-clients = 100

# 最大同一用户连接数
max-same-clients = 5

# 日志
log-level = info
log-output = /var/log/ocserv/ocserv.log

# PID文件
pid-file = /var/run/ocserv.pid

# 网络配置

# 分配给VPN客户端的IP地址池
# 当RADIUS返回Framed-IP-Address时使用RADIUS的值, 否则使用此地址池
ipv4-network = 192.168.99.0
ipv4-netmask = 255.255.255.0

# MTU
mtu = 1400

# DNS服务器
dns = 8.8.8.8
dns = 8.8.4.4

# 中国DNS (可选)
# dns = 223.5.5.5
# dns = 119.29.29.29

# NAT (如果需要)
# run = /usr/sbin/iptables -t nat -A POSTROUTING -s 192.168.99.0/24 -j MASQUERADE

# 路由 (推送路由给客户端)
# 默认全部流量走VPN
route = default

# 或者只推送特定路由:
# route = 10.0.0.0/8
# no-route = 192.168.0.0/16

# 带宽限制 (当RADIUS返回速率属性时, ocserv/RemLink 会使用RADIUS的值)
# ToughRadius 的 Profile 中配置:
#   - Session-Timeout: 会话超时(秒)
#   - WS-Upload-Speed: 上传速率(Kbps)
#   - WS-Download-Speed: 下载速率(Kbps)
# 以下为默认值(当RADIUS未返回时使用):
# rx-data-per-second = 10000000
# tx-data-per-second = 10000000

# 会话超时 (当RADIUS返回Session-Timeout时使用RADIUS的值)
# session-timeout = 86400

# 空闲断开
idle-timeout = 1200

# 移动设备优化
mobile-dpd = 1800

# 输出压缩
output-buffer = 10

# 协议优先级
try-mtu-discovery = true

# 支持的协议
cisco-client-compatibility = true

# Cisco AnyConnect 客户端兼容性
cisco-ft-client-compatibility = true
